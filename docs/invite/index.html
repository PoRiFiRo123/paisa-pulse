<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Join me on Paisa Pulse</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F2F7; --card: #FFFFFF; --label: #000; --secondary: #8A8A8E; --accent: #5E5CE6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --label: #FFF; --secondary: #8E8E93; --accent: #7D7AFF; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--label);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 28px; padding: 28px 24px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--accent); color: #fff; display: grid; place-items: center;
    font: 700 36px/1 ui-rounded, -apple-system, sans-serif; margin: 0 auto 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--secondary); margin: 0 0 6px; font-size: 15px; }
  .code { font: 700 28px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 4px; margin: 18px 0 4px; }
  a.btn { display: block; margin-top: 16px; padding: 15px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  a.alt { display: block; margin-top: 12px; color: var(--accent); text-decoration: none; font-size: 15px; }
  button.copy { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--secondary); }
</style>
</head>
<body>
<main class="card" id="card"><p>This invite link is incomplete. Ask your friend to send it again.</p></main>
<script>
// The code and name come from the #fragment, which browsers never send to the server.
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var c = (p.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12), n = (p.get('n') || '').slice(0, 60);
  if (c.length < 6) return;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  document.getElementById('card').innerHTML =
    '<div class="logo">₹</div>' +
    '<h1>' + (n ? esc(n) + ' invited you' : 'You\'re invited') + '</h1>' +
    '<p>Split bills and trips together on Paisa Pulse, the free finance app that keeps your money on your phone.</p>' +
    '<div class="code">' + c + '</div><button class="copy" id="copy">Copy code</button>' +
    '<a class="btn" href="paisapulse://invite?c=' + c + '">Open in Paisa Pulse</a>' +
    '<a class="alt" href="https://github.com/PoRiFiRo123/paisa-pulse/releases/latest">Don\'t have the app? Get it here</a>' +
    '<div class="foot">No app yet? Install it, sign in under Settings, then open this link again or type the code in People.</div>';
  document.getElementById('copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(c); this.textContent = 'Copied'; };
})();
</script>
</body>
</html>

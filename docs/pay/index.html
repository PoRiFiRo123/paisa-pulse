<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pay with UPI · Paisa Pulse</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F2F7; --card: #FFFFFF; --label: #000; --secondary: #8A8A8E; --accent: #5E5CE6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --label: #FFF; --secondary: #8E8E93; --accent: #7D7AFF; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--label);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 28px; padding: 28px 24px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .to { color: var(--secondary); font-size: 15px; }
  .name { font-size: 22px; font-weight: 600; margin: 2px 0 14px; }
  .amount { font: 700 46px/1.1 ui-rounded, -apple-system, "SF Pro Rounded", sans-serif; letter-spacing: -1px; }
  .note { color: var(--secondary); margin-top: 6px; }
  .qr { margin: 22px auto 8px; width: 220px; height: 220px; background: #fff; border-radius: 18px; padding: 10px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .hint { color: var(--secondary); font-size: 13px; }
  a.pay { display: block; margin-top: 20px; padding: 15px; border-radius: 999px; background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 600; }
  .id { margin-top: 14px; font-size: 14px; color: var(--secondary); word-break: break-all; }
  button.copy { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--secondary); }
  .bad { color: var(--secondary); }
</style>
</head>
<body>
<main class="card" id="card">
  <p class="bad">This payment link is incomplete. Ask your friend to send it again.</p>
</main>
<script src="qrcode.js"></script>
<script>
// Everything comes from the #fragment, which browsers never send to the server.
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var pa = p.get('pa'), pn = p.get('pn') || pa, am = p.get('am'), tn = p.get('tn');
  if (!pa || !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(pa)) return;
  var q = 'pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn) + (am ? '&am=' + encodeURIComponent(am) : '') + '&cu=INR' + (tn ? '&tn=' + encodeURIComponent(tn) : '');
  var upi = 'upi://pay?' + q;
  var money = am ? '₹' + Number(am).toLocaleString('en-IN', { minimumFractionDigits: am.indexOf('.00') > 0 ? 0 : 2, maximumFractionDigits: 2 }) : '';
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  var qr = qrcode(0, 'M'); qr.addData(upi); qr.make();
  document.getElementById('card').innerHTML =
    '<div class="to">Pay</div><div class="name">' + esc(pn) + '</div>' +
    (money ? '<div class="amount">' + money + '</div>' : '') +
    (tn ? '<div class="note">' + esc(tn) + '</div>' : '') +
    '<div class="qr">' + qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }) + '</div>' +
    '<div class="hint">Scan with any UPI app, or on your phone tap below.</div>' +
    '<a class="pay" href="' + upi + '">Pay with a UPI app</a>' +
    '<div class="id">' + esc(pa) + ' <button class="copy" id="copy">Copy</button></div>' +
    '<div class="foot">Sent from Paisa Pulse. This page only shows the link you opened; nothing is stored.</div>';
  document.getElementById('copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(pa); this.textContent = 'Copied'; };
})();
</script>
</body>
</html>

# Native SwiftUI iPhone app. Generate the Xcode project with `xcodegen` (CI does this on macOS).
name: PaisaPulse
options:
  bundleIdPrefix: com.paisapulse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
targets:
  PaisaPulse:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Paisa Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSFaceIDUsageDescription: Paisa Pulse uses Face ID to keep your finances private.
        NSCameraUsageDescription: Scan a card to fill in its network, last 4 digits and expiry. The full number is never stored.
        LSApplicationQueriesSchemes: [sidestore, upi]
        CFBundleURLTypes:
          - CFBundleURLName: com.paisapulse.app
            CFBundleURLSchemes: [paisapulse]
        PaisaReleaseRepo: PoRiFiRo123/paisa-pulse
    entitlements:
      path: App/PaisaPulse.entitlements
      properties:
        com.apple.security.application-groups: [group.com.paisapulse.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paisapulse.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PaisaPulseWidgets
  PaisaPulseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Paisa Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PaisaPulseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.paisapulse.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paisapulse.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
  PaisaPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PaisaPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PaisaPulse.app/PaisaPulse
schemes:
  PaisaPulse:
    build:
      targets:
        PaisaPulse: all
        PaisaPulseTests: [test]
    test:
      targets: [PaisaPulseTests]

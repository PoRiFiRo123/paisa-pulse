name: Build Android + iOS

# Every push to main builds:
#   - PaisaPulse.apk : Android, release build, signed with the same key every time so a new APK
#                      installs over the old one and keeps your data.
#   - PaisaPulse.ipa : iOS, the native SwiftUI app in apple/, built for a FREE Apple ID (app + widget + share extension). Ad-hoc signed with its entitlements; install it with SideStore,
#                      AltStore or Sideloadly, which re-sign it with your Apple ID.
# ...and publishes both as a GitHub Release "build-<run number>" that the in-app update check reads.
# Pushes to claude/** branches build and test the same way but publish no release (artifacts only).

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PAISA_BUILD_NUMBER: ${{ github.run_number }}
  PAISA_RELEASE_REPO: ${{ github.repository }}

jobs:
  android:
    # Native Kotlin + Jetpack Compose app in androidApp/ (the Expo app is retired).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      # Same signing key on every build so updates install over each other: the PAISA_ANDROID_KEYSTORE_B64
      # secret if set (alias androiddebugkey, password android), else a key kept in the build cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.paisa/release.keystore
          key: paisa-android-keystore-v1
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.PAISA_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.paisa
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.paisa/release.keystore
          elif [ ! -f ~/.paisa/release.keystore ]; then
            keytool -genkeypair -keystore ~/.paisa/release.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Paisa Pulse,C=IN"
          fi
          echo "PAISA_KEYSTORE=$HOME/.paisa/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        working-directory: androidApp
        run: |
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../PaisaPulse.apk
          ls -la ../PaisaPulse.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: PaisaPulse.apk, retention-days: 14 }

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots (emulator, sample data)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: bash .github/scripts/android-screenshots.sh

  ios:
    # Native SwiftUI app in apple/ (XcodeGen project). Free Apple ID: app + widget + share extension (3 slots).
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && sw_vers
      - name: Generate the Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PaisaPulse.xcodeproj -scheme PaisaPulse -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee build/xcodebuild.log | grep -E "error:|\*\* (ARCHIVE|BUILD)" || true
          test -d build/app.xcarchive/Products/Applications
      - name: Ad-hoc sign with the App Group and package the .ipa
        run: |
          APP=$(ls -d build/app.xcarchive/Products/Applications/*.app | head -1)
          /usr/bin/python3 -c "import plistlib; plistlib.dump({'com.apple.security.application-groups': ['group.com.paisapulse.app']}, open('/tmp/groups.entitlements', 'wb'))"
          for ext in "$APP"/PlugIns/*.appex; do [ -d "$ext" ] && codesign --force --sign - --entitlements /tmp/groups.entitlements "$ext"; done
          codesign --force --sign - --entitlements /tmp/groups.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          ls "$APP/PlugIns"
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../PaisaPulse.ipa Payload
          ls -la ../PaisaPulse.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            PaisaPulse.ipa
            apple/build/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for rt in reversed(rts):
            for dev in d[rt]:
              if 'iPhone' in dev['name'] and 'Pro' in dev['name'] and 'Max' not in dev['name']:
                print(dev['udid']); sys.exit()
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project PaisaPulse.xcodeproj -scheme PaisaPulse -destination "id=$UDID" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/test.log | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST" || true
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log; then
            grep -n -B3 -A25 -E "error: -\[|Fatal error|crashed|unexpected exit" build/test.log | head -150
            exit 1
          fi
      - name: Screenshots (simulator, sample data)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/PaisaPulse.app | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { # name, extra launch args...
            local name=$1; shift
            xcrun simctl terminate "$UDID" com.paisapulse.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.paisapulse.app -PaisaDemo YES "$@" >/dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for tab in home activity accounts settings; do shot "$tab-$mode" -PaisaTab $tab; done
            shot "add-$mode" -PaisaAdd YES
          done
          ls -la shots
          # Publish to the ci-screenshots branch so they can be viewed without downloading artifacts.
          cd shots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${{ github.sha }} (build ${{ github.run_number }})"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots

  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          {
            echo "Paisa Pulse build ${{ github.run_number }} ($(git log -1 --format=%h))"
            echo
            echo "$(git log -1 --format=%s)"
            echo
            echo "- **Android:** download PaisaPulse.apk on the phone and install it (allow installing from your browser)."
            echo "- **iPhone:** open PaisaPulse.ipa with SideStore (or AltStore / Sideloadly). See docs/INSTALL.md."
          } > notes.md
          gh release create "$TAG" android/PaisaPulse.apk ios/PaisaPulse.ipa \
            --title "Paisa Pulse (build ${{ github.run_number }})" --notes-file notes.md --latest
